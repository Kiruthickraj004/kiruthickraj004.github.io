<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiruthickraj | Full-Stack Developer & Software Engineer</title>
    <meta name="description" content="Portfolio of Kiruthickraj — Full-Stack Developer specializing in Python, Django, DRF, PHP, Laravel, ReactJS, Docker, Redis, and high-performance API architectures." />
    <meta name="keywords" content="Kiruthickraj, Full-Stack Developer, Python, Django, Django REST Framework, PHP, Laravel, ReactJS, Docker, Redis, PostgreSQL, MySQL, Postman" />

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Anti-flicker Theme Script -->
    <script>
      (function() {
        const storedTheme = localStorage.getItem('kiruthick_theme');
        if (storedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-dev-bg-darker text-slate-100 antialiased selection:bg-orange-500/25 selection:text-orange-300 font-sans transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
